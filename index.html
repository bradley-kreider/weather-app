<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#010d1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Weather</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Add location bottom sheet -->
  <div id="sheet-overlay" class="sheet-overlay"></div>
  <div id="add-sheet" class="add-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-inner">
      <div class="sheet-search-row">
        <input id="loc-search" type="text" placeholder="Search city or zip…" autocomplete="off" />
        <button id="loc-close-btn" aria-label="Close">✕</button>
      </div>
      <div id="loc-results" class="loc-results"></div>
    </div>
  </div>

  <div id="app">
    <div id="loading" class="screen active">
      <div class="spinner"></div>
      <p>Getting your location…</p>
    </div>

    <div id="error" class="screen">
      <div class="error-icon">⚠</div>
      <p id="error-msg">Something went wrong.</p>
      <div class="error-actions">
        <button id="retry-btn">Try Again</button>
        <button id="add-location-btn">Add Location</button>
      </div>
    </div>

    <div id="main" class="screen">
      <!-- Top bar: dots + plus -->
      <div class="top-bar">
        <div id="city-dots" class="city-dots"></div>
        <button id="add-btn" aria-label="Add location">+</button>
      </div>

      <!-- Swipe viewport -->
      <div id="swipe-viewport">
        <div id="swipe-track">
          <!-- city panels injected here by JS -->
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { scope: './' });
    }
  </script>
</body>
</html>
